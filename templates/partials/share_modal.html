{% load static %}
<!-- Share Website Component & Modal -->
<div id="rdh-share-component">
  <!-- Share Button in Header -->
  <button type="button" onclick="window.rdhOpenShareModal()" class="btn btn-xs btn-outline inline-flex items-center gap-1.5 glow-hover" title="Share Website" style="display: inline-flex; align-items: center; gap: 0.35rem; border-color: var(--color-brand-primary); color: var(--color-brand-primary); padding: 0.35rem 0.65rem; border-radius: var(--radius-sm); font-weight: 600; cursor: pointer;">
    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="18" cy="5" r="3"></circle>
      <circle cx="6" cy="12" r="3"></circle>
      <circle cx="18" cy="19" r="3"></circle>
      <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
      <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
    </svg>
    <span>Share Website</span>
  </button>

  <!-- Share Modal Dialog -->
  <div id="rdh-share-modal" class="share-modal-overlay" style="display: none;" onclick="if(event.target===this) window.rdhCloseShareModal()">
    <div class="card card-body w-full max-w-sm" style="background: var(--rdh-surface-container); border: 1px solid rgba(255,255,255,0.15); border-radius: var(--radius-lg); padding: 1.25rem; color: #fff; box-shadow: 0 20px 40px rgba(0,0,0,0.6); max-width: 380px; width: 100%; position: relative; z-index: 100000;">
      
      <!-- Header -->
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem;">
        <h3 style="margin: 0; font-size: 1.1rem; font-weight: 700; color: var(--color-brand-primary); display: flex; align-items: center; gap: 0.4rem;">
          <span>✨ Share {{ BRAND_NAME|default:"FreshMart" }}</span>
        </h3>
        <button type="button" onclick="window.rdhCloseShareModal()" style="background: none; border: none; color: #aaa; font-size: 1.5rem; cursor: pointer; padding: 0.25rem; line-height: 1;">&times;</button>
      </div>

      <!-- Image Card Preview inside Share Modal -->
      <div style="margin-bottom: 1rem; border-radius: var(--radius-md); overflow: hidden; border: 1px solid rgba(255,255,255,0.15); background: rgba(0,0,0,0.6);">
        <img src="{% static 'images/share-preview.jpg' %}" alt="{{ BRAND_NAME|default:'FreshMart' }} — Share Preview" style="width: 100%; height: 170px; object-fit: cover; display: block;">
        <div style="padding: 0.75rem;">
          <div style="font-size: 0.85rem; font-weight: 700; color: var(--color-brand-primary);">{{ BRAND_NAME|default:"FreshMart" }} — {{ BRAND_TAGLINE|default:"Fresh groceries, delivered fast" }}</div>
          <div style="font-size: 0.75rem; color: #ccc; margin-top: 0.25rem; line-height: 1.3;">
            Fresh groceries, daily essentials, organic fruits & vegetables, and pantry staples delivered directly to your doorstep.
          </div>
        </div>
      </div>

      <!-- Social Share Buttons Grid -->
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; margin-bottom: 1rem;">
        <!-- WhatsApp -->
        <button type="button" onclick="window.rdhShareTo('whatsapp')" class="btn btn-sm" style="background: #25D366; color: #fff; border: none; display: flex; align-items: center; justify-content: center; gap: 0.4rem; padding: 0.6rem; border-radius: var(--radius-md); font-weight: 600; font-size: 0.85rem; cursor: pointer;">
          📱 WhatsApp
        </button>

        <!-- Twitter / X -->
        <button type="button" onclick="window.rdhShareTo('twitter')" class="btn btn-sm" style="background: #1DA1F2; color: #fff; border: none; display: flex; align-items: center; justify-content: center; gap: 0.4rem; padding: 0.6rem; border-radius: var(--radius-md); font-weight: 600; font-size: 0.85rem; cursor: pointer;">
          🐦 Twitter / X
        </button>

        <!-- Facebook -->
        <button type="button" onclick="window.rdhShareTo('facebook')" class="btn btn-sm" style="background: #1877F2; color: #fff; border: none; display: flex; align-items: center; justify-content: center; gap: 0.4rem; padding: 0.6rem; border-radius: var(--radius-md); font-weight: 600; font-size: 0.85rem; cursor: pointer;">
          📘 Facebook
        </button>

        <!-- Telegram -->
        <button type="button" onclick="window.rdhShareTo('telegram')" class="btn btn-sm" style="background: #229ED9; color: #fff; border: none; display: flex; align-items: center; justify-content: center; gap: 0.4rem; padding: 0.6rem; border-radius: var(--radius-md); font-weight: 600; font-size: 0.85rem; cursor: pointer;">
          ✈️ Telegram
        </button>
      </div>

      <!-- Copy Direct Link Box -->
      <div style="background: rgba(255,255,255,0.05); padding: 0.5rem 0.75rem; border-radius: var(--radius-md); border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: space-between;">
        <input id="rdh-share-url-input" type="text" readonly style="background: none; border: none; color: #ddd; font-size: 0.75rem; width: 70%; outline: none;">
        <button id="rdh-copy-btn" type="button" onclick="window.rdhCopyShareLink()" class="btn btn-xs btn-primary" style="padding: 0.35rem 0.6rem; font-size: 0.75rem; border-radius: var(--radius-sm); cursor: pointer;">
          Copy Link
        </button>
      </div>

    </div>
  </div>
</div>

<script>
  (function() {
    const title = "{{ BRAND_NAME|default:'FreshMart' }} — {{ BRAND_TAGLINE|default:'Fresh groceries, delivered fast' }}";
    const text = "Fresh groceries, daily essentials, organic fruits & vegetables, and pantry staples delivered directly to your doorstep.";
    
    window.rdhGetShareUrl = function() {
      return window.location.href;
    };

    window.rdhOpenShareModal = function() {
      // Use native Web Share API on mobile devices if available
      if (navigator.share && /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
        navigator.share({
          title: title,
          text: text,
          url: window.rdhGetShareUrl()
        }).catch(() => {
          showModal();
        });
      } else {
        showModal();
      }
    };

    function showModal() {
      const modal = document.getElementById('rdh-share-modal');
      const input = document.getElementById('rdh-share-url-input');
      if (input) input.value = window.rdhGetShareUrl();
      if (modal) modal.style.display = 'flex';
    }

    window.rdhCloseShareModal = function() {
      const modal = document.getElementById('rdh-share-modal');
      if (modal) modal.style.display = 'none';
    };

    window.rdhShareTo = function(platform) {
      const url = encodeURIComponent(window.rdhGetShareUrl());
      const shareTitle = encodeURIComponent(title);
      const shareText = encodeURIComponent(text);
      let targetUrl = '';

      if (platform === 'whatsapp') {
        targetUrl = `https://api.whatsapp.com/send?text=${shareTitle}%20-%20${shareText}%20${url}`;
      } else if (platform === 'twitter') {
        targetUrl = `https://twitter.com/intent/tweet?text=${shareTitle}%20-%20${shareText}&url=${url}`;
      } else if (platform === 'facebook') {
        targetUrl = `https://www.facebook.com/sharer/sharer.php?u=${url}`;
      } else if (platform === 'telegram') {
        targetUrl = `https://t.me/share/url?url=${url}&text=${shareTitle}%20-%20${shareText}`;
      }

      if (targetUrl) {
        window.open(targetUrl, '_blank', 'noopener,noreferrer');
      }
    };

    window.rdhCopyShareLink = function() {
      const shareUrl = window.rdhGetShareUrl();
      const btn = document.getElementById('rdh-copy-btn');
      
      const setCopiedText = () => {
        if (btn) btn.innerText = 'Copied!';
        setTimeout(() => {
          if (btn) btn.innerText = 'Copy Link';
        }, 2500);
      };

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(shareUrl).then(setCopiedText).catch(setCopiedText);
      } else {
        const input = document.getElementById('rdh-share-url-input');
        if (input) {
          input.select();
          document.execCommand('copy');
          setCopiedText();
        }
      }
    };
  })();
</script>
