services:
  - type: web
    name: restaurant
    env: python
    region: singapore
    plan: free
    buildCommand: "pip install -r requirements/base.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "uvicorn config.asgi:application --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: restaurant-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: restaurant-redis
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: ADMIN_URL
        value: "backoffice/"
      - key: RESEND_API_KEY
        sync: false


  - type: redis
    name: restaurant-redis
    plan: free
    ipAllowList: []

databases:
  - name: restaurant-db
    databaseName: restaurant
    user: restaurant
    plan: free
